upstream travel_rec_backend {
    hash $sticky_key consistent;

    server 127.0.0.1:8501 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8502 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8503 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8504 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

map $http_cf_connecting_ip $sticky_key {
    default        $http_cf_connecting_ip;
    ""             $remote_addr;
}

server {
    listen 127.0.0.1:8500;
    server_name _;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;
    proxy_buffering     off;

    location = /_stcore/health {
        proxy_pass http://travel_rec_backend;
        access_log off;
    }

    location /_stcore/stream {
        proxy_pass http://travel_rec_backend;
    }

    location / {
        proxy_pass http://travel_rec_backend;
    }
}
